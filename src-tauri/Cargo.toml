[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Brave's adblock-rust: EasyList/EasyPrivacy syntax, network + cosmetic filtering.
# default-features off drops "single-thread" so Engine is Send+Sync and can be
# shared behind Arc across webviews; embedded-domain-resolver avoids a runtime
# PSL download. MPL-2.0 — see THIRD-PARTY-NOTICES.md.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde = { features = ["derive"], version = "1" }
serde_json = "1"
# Note: window creation must never run on a WebView2 IPC thread — on Windows,
# WebviewWindowBuilder::build() deadlocks in synchronous Tauri commands
# (wry#583). Window-creating commands (open_account, preview_start) are
# `async fn`, and the OAuth modal builds on a dedicated spawned thread.
# Only the stable WebviewWindowBuilder API is used anywhere.
tauri = { features = ["tray-icon", "protocol-asset"], version = "2" }
# Async sleep for the 250ms stagger between routine item opens (routines.rs).
# "rt" for spawn_blocking in the MSI updater path (msi_update.rs).
tokio = { version = "1", features = ["time", "rt"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
# v0.9.8: rfd is declared in the target-specific sections at the bottom of
# this file (it must not sit mid-[dependencies]: a [target...] header there
# would swallow every dependency listed after it).
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
sysinfo = "0.34"
# Filter-list downloads. rustls ("tls") only; no native-tls dependency.
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
# v0.9.1: PNG encode/decode for clipboard image history (clipboard.rs).
# Pure Rust, no system libs — needed on all platforms.
png = "0.17"
# v0.9.2: PNG/BMP decode for the clipboard image reader (clipboard_img.rs):
# the "PNG" clipboard format on Windows, image/bmp on Linux. Already in the
# tree via arboard; default-features off keeps it to what we use.
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
# v0.8.2: minisign signature verification for the MSI update path
# (msi_update.rs) — same crate the updater plugin uses internally.
minisign-verify = "0.2"
# v0.8.2: base64 decode of the updater pubkey + .sig assets (msi_update.rs).
base64 = "0.21"

# Pinned to the exact webview2-com that wry 0.57.0 uses (verified via cargo
# tree) so the COM bindings are a single crate instance — a mismatch would be
# two different ICoreWebView2 types and fail to compile.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
# Win32 APIs for the launcher: IShellLinkW (.lnk resolution), ExtractIconExW +
# GDI (exe icon extraction), ShellExecuteW (launching programs). v0.9.2 adds
# Win32_System_Threading for the bare-Win-key hook thread's event
# (CreateEventW/SetEvent), Win32_Security (CreateEventW's attributes type),
# and Win32_UI_Input_KeyboardAndMouse (SendInput for the mask keystroke).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# v0.9.2: direct CF_DIB/CF_DIBV5 clipboard reading for the image watcher
# (clipboard_img.rs). Already in the tree via arboard; no new native deps.
clipboard-win = "5"
# Same windows-core instance webview2-com 0.39.1 uses (0.62.x): needed for
# PWSTR/HSTRING/w! in the WebResourceRequested hook.
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
# v0.9.2: image/bmp X11 clipboard fallback for the image watcher
# (clipboard_img.rs). Already in the tree via arboard; no new native deps.
x11rb = "0.13"

[features]
# Tauri's default desktop mode uses the OS webview (WebView2 on Windows,
# WebKitGTK on Linux) — no bundled Chromium, which keeps RAM and disk use low.
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[package]
authors = ["AppMaka"]
description = "Turn any website into a desktop web app"
edition = "2021"
name = "appmaka"
version = "0.13.0"

# v0.9.8: native save dialog inside the download `Requested` handler.
# The download callback runs on the main thread on both platforms (WebView2's
# DownloadStarting fires on the COM UI thread; WebKitGTK's
# decide-destination is a GTK signal), so tauri-plugin-dialog's blocking
# wrappers are unusable here: they post dialog creation to the main thread
# via run_on_main_thread, then block it waiting — instant deadlock.
# Windows: rfd's sync api (IFileSaveDialog::Show runs its own modal loop
# with balanced COM init; never touches Tauri's event loop). Same rfd
# version as the plugin so cargo unifies.
# Linux: the gtk crate directly (FileChooserNative + nested event pump),
# because rfd's second-GTK-thread design hangs against tao's main loop
# (verified 2026-10-03: save_file() never returns, no dialog appears).
# NOTE: these sections must stay at the end of the file — a [target...]
# header in the middle of [dependencies] would swallow every dependency
# listed after it (this exact mistake dropped five plugins in v0.9.8 dev).
[target.'cfg(windows)'.dependencies.rfd]
version = "0.16"
default-features = false
features = ["common-controls-v6"]

[target.'cfg(target_os = "linux")'.dependencies.gtk]
version = "0.18"
