[[permission]]
identifier = "allow-app-commands"
description = "Allows the app's own commands from trusted local windows (main, clipboard, dock, tab strip, popup bar, split frame, preview header, web search). v0.18.9 lesson, DO NOT REMOVE COMMANDS CASUALLY: adding ANY permission file turns on Tauri's ACL gate for ALL app commands (has_app_acl), and any command missing from every capability is denied with 'Command X not allowed by ACL' — and the frontend shim silently falls back to the browser mock on that error, so the app looks alive with an empty library and dead buttons. Every #[tauri::command] must be listed here (cargo test acl_commands_all_listed enforces it). Remote webviews (acct-*, tabbed-*, popup-*, oauth-*, split panes, preview sites) must NEVER get this permission — they only get allow-note-user-gesture, and only because that command is harmless by design. This permission has no remote section, so even a window-label match cannot let a remote page invoke these commands (origin mismatch denies it)."
