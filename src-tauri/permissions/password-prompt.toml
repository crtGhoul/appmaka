[[permission]]
identifier = "allow-password-prompt"
description = "Enables the six in-page login-detector commands (v0.18.26): stage_password, staged_password_state, confirm_staged_password, never_save_password, vault_prompt_state, fill_login_for_window. Granted to account, tabbed, and split-pane webviews by the password-prompt capability so a login form can offer to save and fill. Each command is label-derived (never trusts page-supplied ids), enforces the domain lock in Rust, and confirm/fill require a recent trusted user gesture; no command returns a password, and the only disk write is the OS vault via save_credential."
commands.allow = ["stage_password", "staged_password_state", "confirm_staged_password", "never_save_password", "vault_prompt_state", "fill_login_for_window"]
