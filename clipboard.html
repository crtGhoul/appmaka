<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Clipboard history</title>
<style>
  /* Clipboard history popup (v0.9.1, text + images). Quiet, launcher-like:
     one accent, plain labels, everything else gray. Self-contained CSS —
     this page is bundled separately from the main app (see vite.config.ts). */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 13px;
    color: #1f2329;
    background: rgba(255, 255, 255, 0.97);
    border: 1px solid #e0e2e8;
    border-radius: 12px;
    overflow: hidden;
    user-select: none;
  }
  #root { height: 100%; display: flex; flex-direction: column; }
  /* v0.9.4: top row holds the Select/Done + Copy selected buttons beside
     the search box; the All | Text | Images tabs get their own row below. */
  .clip-top {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 8px;
    border-bottom: 1px solid #eceef1;
  }
  .clip-top .clip-search { flex: 1 1 auto; min-width: 0; }
  .clip-top-btn {
    flex: none;
    font: inherit;
    font-size: 12.5px;
    color: #4f46e5;
    background: none;
    border: 1px solid #d4d7dc;
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
  }
  .clip-top-btn:hover:not(:disabled) { background: #f2f3f6; }
  .clip-top-btn:disabled { color: #b0b5bd; border-color: #e4e6ea; cursor: default; }
  .clip-top-btn.primary { background: #4f46e5; border-color: #4f46e5; color: #fff; }
  .clip-top-btn.primary:hover:not(:disabled) { background: #4441d8; }
  .clip-top-btn.primary:disabled { background: #c7c9f2; border-color: #c7c9f2; color: #fff; }
  .clip-tabs {
    flex: none;
    display: flex;
    gap: 4px;
    padding: 8px 12px;
    border-bottom: 1px solid #eceef1;
  }
  .clip-tabs button {
    font: inherit;
    font-size: 12px;
    color: #8a8f98;
    background: none;
    border: none;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .clip-tabs button:hover { background: #f2f3f6; color: #1f2329; }
  .clip-tabs button.active { background: #eef0ff; color: #4f46e5; font-weight: 600; }
  .clip-tabs button:focus-visible { outline: 2px solid #4f46e5; outline-offset: 1px; }
  /* v0.9.12: "Pinned only" switch sits at the right end of the tabs row.
     Same quiet treatment as the tabs; accent only when on. */
  .clip-tabs .clip-pinnedonly { margin-left: auto; }
  .clip-tabs .clip-pinnedonly.active {
    background: #eef0ff;
    color: #4f46e5;
    font-weight: 600;
  }
  .clip-search input {
    font: inherit;
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #d4d7dc;
    border-radius: 8px;
    background: #fff;
    color: #1f2329;
    outline: none;
  }
  .clip-search input:focus { border-color: #4f46e5; }
  .clip-search input::placeholder { color: #9aa0a8; }
  .clip-list {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 4px;
    margin: 0;
    list-style: none;
  }
  .clip-item {
    width: 100%;
    text-align: left;
    font: inherit;
    display: block;
    padding: 8px 10px;
    border: none;
    border-radius: 8px;
    background: none;
    cursor: pointer;
    color: #1f2329;
  }
  .clip-item:hover { background: #f2f3f6; }
  .clip-item.selected { background: #eef0ff; }
  /* v0.9.3 multi-select: checkbox sits beside the row; the row button
     stays the interactive element (the input is a visual indicator). */
  .clip-row { display: flex; align-items: flex-start; }
  .clip-row .clip-item { flex: 1 1 auto; min-width: 0; }
  /* v0.9.12: per-row pin toggle. Quiet gray at rest; accent when the
     entry is pinned. Sits beside the row, never inside the copy
     button (nested buttons are invalid HTML). */
  .clip-pin {
    flex: none;
    align-self: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    margin-right: 4px;
    padding: 0;
    color: #b0b5bd;
    background: none;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .clip-pin:hover { background: #f2f3f6; color: #6b7078; }
  .clip-pin.active { color: #4f46e5; }
  .clip-pin:focus-visible { outline: 2px solid #4f46e5; outline-offset: 1px; }
  .clip-row .clip-item { flex: 1 1 auto; min-width: 0; }
  .clip-check {
    flex: none;
    width: 15px;
    height: 15px;
    margin: 13px 2px 0 8px;
    accent-color: #4f46e5;
    cursor: pointer;
  }
  .clip-item.dimmed { opacity: 0.5; }
  .clip-item .text {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.35;
  }
  .clip-item img.thumb {
    display: block;
    max-width: 200px;
    max-height: 160px;
    width: auto;
    height: auto;
    border-radius: 6px;
    border: 1px solid #e0e2e8;
    background: #f7f8fa;
  }
  .clip-item .meta {
    margin-top: 3px;
    font-size: 11.5px;
    color: #8a8f98;
  }
  .clip-empty {
    padding: 32px 20px;
    text-align: center;
    color: #8a8f98;
    font-size: 13px;
    line-height: 1.5;
  }
  .clip-error {
    padding: 16px 20px;
    color: #b3261e;
    font-size: 13px;
  }
  .clip-foot {
    flex: none;
    padding: 7px 12px;
    border-top: 1px solid #eceef1;
    font-size: 11.5px;
    color: #8a8f98;
    display: flex;
    gap: 12px;
  }
  .clip-foot b { font-weight: 600; color: #6b7078; }
  .clip-foot .muted { color: #b0b5bd; }
  .clip-foot button {
    font: inherit;
    font-size: 11.5px;
    color: #4f46e5;
    background: none;
    border: none;
    border-radius: 4px;
    padding: 2px 4px;
    margin: -2px -4px;
    cursor: pointer;
  }
  .clip-foot button:hover:not(:disabled) { text-decoration: underline; }
  .clip-foot button:disabled { color: #b0b5bd; cursor: default; }
</style>
</head>
<body>
  <div id="root"></div>
<script type="module" src="./src/clipboard.tsx"></script>
</body>
</html>
