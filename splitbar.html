<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Split view</title>
<style>
  /* Split bar (v0.18.8): the one split window's top strip. The bar is
     the frame's first child webview, 36px tall; the frame is
     undecorated, so the bar is also its drag handle and its window
     controls. Same dark, one-accent treatment as the tab strip
     (tabstrip.html). Bundled separately (vite.config.ts "splitbar"
     input, loaded by the backend as splitbar.html). */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 12.5px;
    color: #e1e1e1;
    background: #1b1b1b;
    overflow: hidden;
    user-select: none;
  }
  #root { height: 100%; }
  .bar { height: 100%; display: flex; align-items: center; gap: 2px; padding: 0 6px; }
  .panes { flex: 1 1 auto; display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; }
  button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: #a0a0a0;
    font: inherit;
    cursor: pointer;
    border-radius: 4px;
    white-space: nowrap;
  }
  button:hover { background: #2e2e2e; color: #fff; }
  button:focus-visible { outline: 2px solid #4f46e5; outline-offset: -2px; }
  button:disabled { color: #555; cursor: default; background: none; }
  button.active { background: #3e3e3e; color: #f1f1f1; }
  .pane { padding: 0 10px; height: 26px; max-width: 168px; overflow: hidden; text-overflow: ellipsis; }
  .pane-wrap { display: inline-flex; align-items: center; border-radius: 4px; }
  .pane-wrap.active { background: #3e3e3e; }
  .pane-wrap.active .pane { color: #f1f1f1; }
  /* v0.18.10: drag a pane to swap positions (accent outline on the
     drop target), or out of the bar into its own window. */
  .pane-wrap.dragging { opacity: 0.5; }
  .pane-wrap.drag-over { outline: 2px solid #4f46e5; outline-offset: -2px; }
  .pane-popout { padding: 0 6px; height: 26px; color: #777; font-size: 13px; line-height: 1; opacity: 0; }
  .pane-wrap:hover .pane-popout, .pane-wrap.active .pane-popout, .pane-popout:focus-visible { opacity: 1; }
  .pane-add { padding: 0 9px; height: 26px; color: #8a8f98; font-size: 15px; line-height: 1; }
  .pane-close { padding: 0 6px; height: 26px; color: #777; font-size: 14px; line-height: 1; }
  .pane-close:hover { background: #4a2b2b; color: #fff; }
  .layout { padding: 0 8px; height: 26px; }
  .close { padding: 0 10px; height: 26px; }
  .close:hover { background: #e81123; color: #fff; }
  .win-controls { flex: none; display: flex; align-items: center; gap: 2px; }
  .win-btn { padding: 0 10px; height: 26px; }
  .win-close:hover { background: #e81123; color: #fff; }
  .sep { flex: none; width: 1px; height: 20px; background: #3a3a3a; margin: 0 4px; }
  .loading { padding: 0 12px; color: #8a8f98; }
</style>
</head>
<body>
  <div id="root"></div>
<script type="module" src="./src/splitbar.tsx"></script>
</body>
</html>
