<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AppMaka Dock</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        color: #f3f4f8;
        font-family: "Inter", "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 12px;
        user-select: none;
        -webkit-user-select: none;
      }
      .dock {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px;
        background: rgba(14, 16, 24, 0.9);
        backdrop-filter: blur(20px) saturate(150%);
        -webkit-backdrop-filter: blur(20px) saturate(150%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
      }
      .dock.edge-left, .dock.edge-right {
        flex-direction: column;
      }
      .dock.edge-bottom {
        flex-direction: row;
      }
      .dock-item {
        position: relative;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.04);
        color: #f3f4f8;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: background-color 120ms ease, border-color 120ms ease, transform 120ms ease;
      }
      .dock-item:hover {
        background: rgba(139, 92, 246, 0.18);
        border-color: rgba(139, 92, 246, 0.42);
        transform: translateY(-1px);
      }
      .dock-item:focus-visible {
        outline: 2px solid #8b5cf6;
        outline-offset: -2px;
      }
      .dock-item.is-focused {
        background: rgba(139, 92, 246, 0.22);
        border-color: #8b5cf6;
      }
      .dock-icon {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        object-fit: contain;
      }
      .dock-fallback {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 13px;
        color: #fff;
        background: linear-gradient(135deg, #7c3aed 0%, #9d174d 100%);
      }
      .dock-dot {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #a78bfa;
      }
      .dock.edge-left .dock-dot { left: 2px; top: 50%; transform: translateY(-50%); }
      .dock.edge-right .dock-dot { right: 2px; top: 50%; transform: translateY(-50%); }
      .dock.edge-bottom .dock-dot { bottom: 2px; left: 50%; transform: translateX(-50%); }
      .dock-badge {
        position: absolute;
        top: 2px;
        right: 2px;
        min-width: 15px;
        height: 15px;
        padding: 0 4px;
        border-radius: 8px;
        background: linear-gradient(135deg, #7c3aed 0%, #9d174d 100%);
        color: #fff;
        font-size: 10px;
        font-weight: 600;
        line-height: 15px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dock.tsx"></script>
  </body>
</html>
