<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AppMaka tabs</title>
<style>
  /* Tab strip window (v0.10.0, Linux): our own trusted UI rendered above
     the tabbed page window. Dark like the Windows native strip; quiet,
     one accent, plain labels. Bundled separately (vite.config.ts
     "tabstrip" input, loaded by the backend as tabstrip.html). */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Inter", "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12.5px;
    color: #f3f4f8;
    background: #0d0f16;
    overflow: hidden;
    user-select: none;
  }
  #root { height: 100%; display: flex; align-items: stretch; }
  .tabs {
    flex: 1 1 auto;
    display: flex;
    align-items: stretch;
    min-width: 0;
    overflow: hidden;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 64px;
    max-width: 168px;
    flex: 1 1 0;
    padding: 0 6px 0 12px;
    color: #94a3b8;
    background: none;
    border: none;
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab:hover { background: rgba(255, 255, 255, 0.07); color: #e2e8f0; }
  .tab.active { background: rgba(139, 92, 246, 0.16); color: #ffffff; }
  .tab:focus-visible { outline: 2px solid #8b5cf6; outline-offset: -2px; }
  .tab .name {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tab .x {
    flex: none;
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    color: inherit;
    font-size: 14px;
    line-height: 1;
  }
  .tab .x:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
  .add, .winx {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: #cbd5e1;
    font: inherit;
    cursor: pointer;
  }
  .add { width: 34px; font-size: 16px; }
  .add:hover { background: rgba(139, 92, 246, 0.2); color: #fff; }
  .winx { width: 46px; font-size: 14px; }
  .winx:hover { background: #e81123; color: #fff; }
  .add:focus-visible, .winx:focus-visible { outline: 2px solid #8b5cf6; outline-offset: -2px; }
  .picker {
    position: fixed;
    top: 44px;
    left: 8px;
    z-index: 10;
    min-width: 240px;
    max-width: 340px;
    max-height: 320px;
    overflow-y: auto;
    background: #161924;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    padding: 6px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  .picker button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    background: none;
    border: none;
    border-radius: 6px;
    color: #e1e1e1;
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .picker button:hover { background: rgba(139, 92, 246, 0.16); }
  .picker .empty { padding: 12px; color: #94a3b8; }
  .loading { padding: 0 12px; color: #94a3b8; align-self: center; }
</style>
</head>
<body>
  <div id="root"></div>
<script type="module" src="./src/tabstrip.tsx"></script>
</body>
</html>
