name: release

# Automated full release pipeline for AppMaka.
# Runs automatically when main is pushed with a new version in package.json,
# when a v* tag is pushed, or when triggered manually via workflow_dispatch.
# Follows docs/RELEASE.md steps 3–6: builds Windows + Linux bundles, verifies
# minisign signatures via scripts/make-latest-json.mjs, publishes a full
# (non-prerelease) GitHub Release with all installers + .sig files + latest.json,
# and updates latest.json on main.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-release:
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version and existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] || [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping automatic release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release ${TAG} does not exist yet; building and publishing."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck + build frontend
        run: npm run build

      - name: Build Tauri bundles (NSIS + MSI)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
          if-no-files-found: error

  build-linux:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck + build frontend
        run: npm run build

      - name: Build Tauri bundles (AppImage + deb + rpm)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.sig
          if-no-files-found: error

  publish-release:
    needs: [check-release, build-windows, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-assets-raw/windows

      - name: Download Linux assets
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release-assets-raw/linux

      - name: Flatten assets and generate verified latest.json
        run: |
          mkdir -p release-assets
          find release-assets-raw -type f -exec cp {} release-assets/ \;
          ls -la release-assets/

          VERSION="${{ needs.check-release.outputs.version }}"
          NOTES=$(node -p "try { require('./latest.json').notes } catch { '' }" || true)
          if [ -z "$NOTES" ]; then
            NOTES="AppMaka v${VERSION}"
          fi

          if compgen -G "release-assets/*.sig" > /dev/null; then
            node scripts/make-latest-json.mjs "$VERSION" ./release-assets "$NOTES" ./release-assets/latest.json
          else
            echo "Warning: No .sig files generated (TAURI_SIGNING_PRIVATE_KEY not set); copying repo latest.json"
            cp latest.json ./release-assets/latest.json
          fi

      - name: Create or update full GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.check-release.outputs.tag }}"
          VERSION="${{ needs.check-release.outputs.version }}"
          NOTES=$(node -p "try { require('./release-assets/latest.json').notes } catch { 'AppMaka v' + '${VERSION}' }")

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --prerelease=false --draft=false --latest
          else
            gh release create "$TAG" release-assets/* \
              --title "AppMaka ${TAG}" \
              --notes "$NOTES" \
              --latest
          fi
