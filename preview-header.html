<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AppMaka Preview</title>
<link rel="stylesheet" href="/preview-header.css" />
</head>
<body>
  <div class="banner" id="banner">
    <span>Sign in on the site above, then click <strong>Add to the Forge</strong></span>
    <span class="arrow" aria-hidden="true">→</span>
    <button class="dismiss" id="dismiss" aria-label="Dismiss">×</button>
  </div>
  <div class="controls">
    <span class="badge">Preview</span>
    <span class="url" id="url"></span>
    <label for="label">Name this login:</label>
    <input id="label" type="text" placeholder="e.g. Personal" maxlength="60" autocomplete="off" />
    <span class="spacer"></span>
    <span class="error" id="msg" role="alert"></span>
    <button id="add" class="action primary">Add to the Forge</button>
    <button id="discard" class="action ghost">Discard</button>
    <button id="reload" class="action ghost small" title="Reload the preview page">↻ Reload</button>
  </div>
<script type="module" src="./src/preview-header.ts"></script>
</body>
</html>
